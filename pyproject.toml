[project]
name = "course-events-aggregator"
version = "0.1.0"
description = "Backend aggregator for Events Provider API"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.32.0",
    "fastapi>=0.128.8",
    "greenlet>=3.2.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.39.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.17.2",
]
