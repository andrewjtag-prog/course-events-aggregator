apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-aggregator
  namespace: student-andrewjtag-prog-events-aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events-aggregator
  template:
    metadata:
      labels:
        app: events-aggregator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/andrewjtag-prog/course-events-aggregator:latest
        ports:
        - containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # Блок env мы УДАЛИЛИ. Платформа сама подставит DATABASE_URL, API_KEY и BASE_URL.